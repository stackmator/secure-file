[package]
name = "secure-file"
version = "0.3.0"
edition = "2021"
rust-version = "1.74"
description = "Cross-platform owner-only filesystem access for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stackmator/secure-file"
homepage = "https://github.com/stackmator/secure-file"
documentation = "https://docs.rs/secure-file"
readme = "README.md"
keywords = ["security", "permissions", "file", "acl", "private"]
categories = ["filesystem", "os"]

[dependencies]

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3.27.0"
