name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  cross:
    name: cross-check (other Unix targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd,x86_64-unknown-netbsd,x86_64-unknown-illumos,aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check other Unix targets
        run: |
          for target in x86_64-unknown-freebsd x86_64-unknown-netbsd x86_64-unknown-illumos aarch64-unknown-linux-gnu; do
            echo "::group::cargo check --target $target"
            cargo check --all-targets --target "$target"
            echo "::endgroup::"
          done

  msrv:
    name: msrv (1.74)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.74
        uses: dtolnay/rust-toolchain@1.74.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check library on MSRV
        run: cargo check --lib

  mounts:
    name: mount-dependent (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Prepare filesystems
        run: |
          sudo mkdir -p /mnt/secure-file-ro /mnt/secure-file-cross
          sudo mount -t tmpfs tmpfs /mnt/secure-file-ro
          sudo mount -t tmpfs tmpfs /mnt/secure-file-cross
          sudo chmod 777 /mnt/secure-file-ro /mnt/secure-file-cross
          sudo mount -o remount,ro /mnt/secure-file-ro
          echo "SECURE_FILE_RO_DIR=/mnt/secure-file-ro" >> "$GITHUB_ENV"
          echo "SECURE_FILE_CROSS_DIR=/mnt/secure-file-cross" >> "$GITHUB_ENV"

      - name: Run mount-dependent tests
        run: cargo test --test ci_env -- --nocapture

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
